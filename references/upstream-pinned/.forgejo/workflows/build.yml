# Build every push to main and every pull request and run the unit tests (tests/, TestKit); release every pushed version
# tag. Alongside, rebuild each SSI release this repository reproduces (v1.1, v1.2, v1.3) from its tag and require SSI's
# exact bytes.
#
# A release can also be cut for a tag that predates this workflow: run it by hand (workflow_dispatch) with the tag.
# The tag's src/ and build/ are built with the current scripts.
#
# A release, pushed or dispatched, waits for both build and reproduce: a toolchain or image change that no longer
# reproduces SSI's releases stops it before anything is published.
#
# Every job runs in the CI image named by the repository variable CI_IMAGE. The image holds proprietary DOS toolchains,
# so it never comes from a public registry:
#   forge.schkerke.com       forge.schkerke.com/brian/dosbox-x-ci@sha256:<digest>, pulled with REGISTRY_USER and
#                            REGISTRY_TOKEN; docker buildx imagetools inspect forge.schkerke.com/brian/dosbox-x-ci:<tag>
#                            prints the digest of a newly pushed image.
#   forgejo.brazencrows.com  local/dosbox-x-ci:<date>, loaded into its runner over SFTP (brazencrows.com's
#                            provisioning/bc-forgejo-runner/load-ci-image.sh); there is no registry, so the credentials
#                            fall back to 'none', which the runner never uses for an image it already has.
# Rebuilding the image changes nothing here until CI_IMAGE does.
#
# Pull requests from forks never run: their code would run in that image. The checkout is a plain git fetch from this
# forge rather than actions/checkout, so nothing is downloaded from anywhere else.

# 2026-10-16 - bms - Forgejo splits the YAML up when doing job parsing, so YAML anchors don't work as intended. Removed
#                    the container and checkout anchor definitions; cut and paste for the win. The jobs have to remain
#                    identical.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build and release, for example v1.1
        required: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    # A build takes seconds; build.sh stops a stuck DOSBox-X after ten minutes, and this stops anything else.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    env:
      # The DOS toolchains live in the image.
      TOOLS: /drive_d
    steps:
      # All branches and tags: reproduce.sh builds SSI's release tags, and a release names one.
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Build and run the unit tests
        run: ./build.sh --test

  reproduce:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    # A build takes seconds; build.sh stops a stuck DOSBox-X after ten minutes, and this stops anything else.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    strategy:
      matrix:
        # Keep in step with the tags in .forgejo/ssi-releases.txt.
        tag: [v1.1, v1.2, v1.3]
    env:
      TOOLS: /drive_d
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Rebuild ${{ matrix.tag }} and compare with SSI's release
        run: .forgejo/scripts/reproduce.sh "${{ matrix.tag }}"

  release:
    needs: [build, reproduce]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    # A build takes seconds; build.sh stops a stuck DOSBox-X after ten minutes, and this stops anything else.
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER || 'none' }}
        password: ${{ secrets.REGISTRY_TOKEN || 'none' }}
    env:
      TOOLS: /drive_d
      # The version being released: the dispatched tag, or the pushed one.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        env:
          CLONE_URL: ${{ github.event.repository.clone_url }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$CLONE_URL"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "+$REF:refs/ci/head"
          git checkout -q --detach "$SHA"
      - name: Use the dispatched tag's source
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Only a tag: release.sh would otherwise have Forgejo create a tag of that name (a branch's, say) on main.
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag." >&2; exit 1; }
          # The tag's whole src/ and build/, so a file only newer versions have (build/toolchain) can't leak in.
          rm -rf src build
          git checkout "$TAG" -- src build
          # Date the zip's files by the tag's commit, as a pushed tag would.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$TAG")" >> "$GITHUB_ENV"

      # The same source and image as the build job; reproduce shows the build gives the same bytes every time.
      - name: Build
        run: ./build.sh

      - name: Package
        run: ./package.sh "$TAG"

      - name: Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .forgejo/scripts/release.sh "$TAG"
